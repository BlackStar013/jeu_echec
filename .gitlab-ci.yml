image: python:3.12

stages:
  - test

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install pytest pygame

tests:
  stage: test

  script:
    - python -m unittest discover -s tests

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

  after_script:
    - python -m pytest tests/ --junitxml=report.xml || true